<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Welcome to the enchanting world of storytelling! Here, you'll explore captivating narratives crafted with care and creativity. As a TV series writer, I invite you to immerse yourself in these pages and experience the power of words to transport you to new worlds and evoke deep emotions. Welcome to my literary realm, where inspiration and entertainment await you!">
    <meta name="keywords" content="writer,productor,headwriter,films,series,television">
    <title>Marta Betoldi</title>
    <link rel="icon" type="image/x-icon" href="/fotos/favicon.png">
    <!-- body es flex (.elBody): #root no debe meter una caja intermedia -->
    <style>#root { display: contents; }</style>
    <!-- Tema antes de pintar, así el modo oscuro no arranca con un flash blanco.
         Lo elegido con el botón (localStorage) manda; si no, claro. -->
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') theme = 'light';
            document.documentElement.dataset.theme = theme;
            document.documentElement.dataset.bsTheme = theme;
        })();
    </script>
</head>

<body class="elBody fadeIn">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
