[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 necesita Node 20.19 o superior
  NODE_VERSION = "22"

# SPA: cualquier ruta (/proyectos/edha, /contacto…) sirve index.html y React decide qué mostrar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
